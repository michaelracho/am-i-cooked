<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="author" content="Raph Michael Racho" />
    <title>Am I Cooked?</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314807a'/%3E%3Crect x='44' y='20' width='17' height='5' rx='2.5' fill='%23fff'/%3E%3Cpath d='M6 22h40a20 20 0 0 1-40 0z' fill='%23fff'/%3E%3Cpath d='M8 0C10 5 14 7 14 12a6 6 0 0 1-12 0C2 8 6 6 8 0z' transform='translate(9 47) scale(.7)' fill='%23ffb84d'/%3E%3Cpath d='M8 0C10 5 14 7 14 12a6 6 0 0 1-12 0C2 8 6 6 8 0z' transform='translate(33 47) scale(.7)' fill='%23ffb84d'/%3E%3Cpath d='M8 0C10 5 14 7 14 12a6 6 0 0 1-12 0C2 8 6 6 8 0z' transform='translate(19.5 45) scale(.95)' fill='%23ffd166'/%3E%3C/svg%3E"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;800&display=swap"
    />
    <style>
      :root {
        --bg: #f5fafa;
        --surf: #fff;
        --ink: #1f3d46;
        --mut: #678087;
        --line: #dce9ea;
        --rule: #b7d8d9;
        --ac: #14807a;
        --panel: #e6f5f2;
        --pt: #1b3a43;
        --pm: #5a7b82;
        --lock: #a3e6d3;
        --hb: #0a766d;
        --hard: #a05a00;
        --out: #9aafb4;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          16px/1.5 "Schibsted Grotesk",
          system-ui,
          sans-serif;
      }
      .wrap {
        max-width: 1060px;
        margin: 0 auto;
        padding: 28px 18px 110px;
      }
      h1 {
        font-size: 2rem;
        line-height: 1.1;
        margin: 0 0 6px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .lead {
        color: var(--mut);
        margin: 0 0 20px;
        max-width: 56ch;
      }
      .tabs {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 22px;
      }
      .tab {
        font: inherit;
        font-size: 0.92rem;
        font-weight: 600;
        padding: 7px 15px;
        border-radius: 99px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--ink);
        cursor: pointer;
      }
      .tab.on {
        background: var(--ac);
        color: #fff;
        border-color: var(--ac);
      }
      main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 420px);
        gap: 28px;
        align-items: start;
      }
      @media (min-width: 861px) {
        #res {
          position: sticky;
          top: 16px;
        }
      }
      @media (max-width: 860px) {
        main {
          grid-template-columns: 1fr;
        }
      }
      .grp {
        margin-bottom: 22px;
      }
      .grp h2 {
        font-size: 1.05rem;
        margin: 0;
        padding-bottom: 6px;
        border-bottom: 2px solid var(--rule);
      }
      .grp h2 span {
        font-weight: 400;
        color: var(--mut);
        font-size: 0.9rem;
      }
      .row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 104px 100px;
        gap: 8px;
        align-items: center;
        padding: 9px 0;
        border-bottom: 1px solid var(--line);
      }
      .row.hd {
        border: 0;
        padding: 0 0 4px;
      }
      .sm {
        font-size: 0.8rem;
        color: var(--mut);
      }
      input,
      select {
        font: inherit;
        color: var(--ink);
        background: var(--surf);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 7px 9px;
        width: 100%;
        min-width: 0;
      }
      input:disabled {
        opacity: 0.45;
      }
      :focus-visible {
        outline: 2px solid var(--ac);
        outline-offset: 2px;
      }
      button {
        font: inherit;
        cursor: pointer;
      }
      .panel {
        background: var(--panel);
        color: var(--pt);
        border: 1px solid #cfe8e4;
        border-radius: 22px;
        padding: 22px;
      }
      .panel .sm {
        color: var(--pm);
      }
      .hl {
        font-size: 1.3rem;
        line-height: 1.3;
        font-weight: 600;
        margin: 0 0 6px;
      }
      .hl b {
        color: var(--hb);
        font-weight: 800;
      }
      .track {
        position: relative;
        height: 10px;
        border-radius: 9px;
        background: rgba(20, 70, 80, 0.12);
        margin: 22px 0 6px;
      }
      .rng {
        position: absolute;
        top: 0;
        bottom: 0;
        border-radius: 9px;
        background: var(--ac);
        opacity: 0.55;
      }
      .mk {
        position: absolute;
        top: -5px;
        bottom: -5px;
        width: 3px;
        margin-left: -1px;
        background: var(--pt);
        border-radius: 2px;
      }
      .ladder {
        margin: 14px 0;
        display: grid;
        gap: 6px;
      }
      .l {
        display: grid;
        grid-template-columns: 58px 1fr;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        border-radius: 12px;
        border: 1px solid transparent;
      }
      .gr {
        font-size: 1.3rem;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }
      .l.lock {
        background: var(--lock);
        color: #0b2b25;
      }
      .l.lock .sm {
        color: #0b2b25;
      }
      .l.go {
        border-color: #a9d3cf;
        background: rgba(255, 255, 255, 0.55);
      }
      .l.hard {
        border-color: var(--hard);
        color: var(--hard);
      }
      .l.out {
        color: var(--out);
      }
      .l.out .gr {
        text-decoration: line-through;
      }
      .l.me {
        box-shadow: 0 0 0 2px var(--ac);
      }
      .tag {
        font-size: 0.72rem;
        font-weight: 600;
        border: 1px solid currentColor;
        border-radius: 99px;
        padding: 0 7px;
        margin-left: 8px;
      }
      .bar {
        display: none;
      }
      @media (max-width: 860px) {
        .bar {
          display: block;
          position: fixed;
          inset: auto 0 0;
          background: var(--panel);
          color: var(--pt);
          border-top: 1px solid #cfe8e4;
          box-shadow: 0 -4px 16px rgba(20, 70, 80, 0.08);
          padding: 12px 18px;
          font-size: 0.95rem;
          z-index: 9;
        }
        .bar b {
          color: var(--hb);
        }
      }
      details {
        border-top: 2px solid var(--rule);
        border-bottom: 2px solid var(--rule);
        padding: 10px 0;
        margin-bottom: 22px;
      }
      summary {
        font-weight: 600;
        cursor: pointer;
      }
      .cfg {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
        gap: 10px;
        margin: 12px 0;
      }
      .ed {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 78px 34px;
        gap: 6px;
        margin: 5px 0;
      }
      .ed.it {
        margin-left: 16px;
      }
      .x {
        border: 1px solid var(--line);
        background: transparent;
        color: var(--mut);
        border-radius: 8px;
      }
      .add {
        border: 1px dashed var(--mut);
        background: transparent;
        color: var(--ink);
        border-radius: 8px;
        padding: 5px 11px;
        font-size: 0.88rem;
        margin: 6px 6px 6px 0;
      }
      .credit {
        margin-top: 32px;
        color: var(--mut);
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Am I Cooked?</h1>
      <p class="lead">
        Enter what you’ve scored, predict the rest, and see which grades are still within reach.
      </p>
      <div class="tabs" id="tabs"></div>
      <main>
        <div>
          <div id="setup"></div>
          <div id="inp"></div>
        </div>
        <aside id="res"></aside>
      </main>
      <footer class="credit">Made by Raph Michael Racho</footer>
    </div>
    <div class="bar" id="bar"></div>
    <script>
      const $ = (s) => document.querySelector(s),
        esc = (s) =>
          String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
      const uid = () => Math.random().toString(36).slice(2, 8);
      const SC = [
        [1, 96],
        [1.25, 90],
        [1.5, 84],
        [1.75, 78],
        [2, 72],
        [2.25, 66],
        [2.5, 60],
        [2.75, 55],
        [3, 50],
        [4, 40],
        [5, 0],
      ];
      const it = (n, max) => ({ id: uid(), n, max, s: "", e: "" }),
        gp = (n, w, items) => ({ id: uid(), n, w, items });
      const sub = (n, groups) => ({
        id: uid(),
        n,
        goal: 2,
        pass: 3,
        scale: SC.map(([g, m]) => ({ g, m })),
        groups,
      });
      const blank = () =>
        sub("New subject", [
          gp("Exams", 60, [it("Exam 1", 100), it("Exam 2", 100)]),
          gp("Other", 40, [it("Activities", 100)]),
        ]);
      let D;
      try {
        D = JSON.parse(localStorage.getItem("gp1"));
      } catch (e) {}
      if (!D || !D.subs || !D.subs.length) D = { cur: null, subs: [blank()] };
      if (!D.subs.some((s) => s.id === D.cur)) D.cur = D.subs[0].id;
      const save = () => {
        try {
          localStorage.setItem("gp1", JSON.stringify(D));
        } catch (e) {}
      };
      const cur = () => D.subs.find((s) => s.id === D.cur);
      const fx = (n) => (n == null ? "none" : (+n).toFixed(2));
      const sorted = (S) => S.scale.slice().sort((a, b) => b.m - a.m);
      const gradeFor = (S, v) => {
        const r = sorted(S).find((r) => v >= r.m - 1e-9);
        return r ? r.g : null;
      };
      let setupOpen = false;
      document.addEventListener(
        "toggle",
        (e) => {
          if (e.target.id === "cfg") setupOpen = e.target.open;
        },
        true,
      );

      function calc(S) {
        let items = [],
          W = 0,
          base = 0,
          U = 0;
        S.groups.forEach((g) => {
          const n = g.items.length || 1;
          g.items.forEach((i) => {
            const w = (+g.w || 0) / n,
              mx = +i.max || 100,
              s = i.s !== "" ? +i.s : null,
              e = i.e !== "" ? +i.e : null;
            const st = s !== null ? "done" : e !== null ? "est" : "open",
              p = st === "done" ? (s / mx) * 100 : st === "est" ? e : null;
            W += w;
            if (p === null) U += w;
            else base += (w * p) / 100;
            items.push({ i, w, mx, st, p });
          });
        });
        if (W > 0) {
          base = (base / W) * 100;
          U = (U / W) * 100;
        }
        return { items, base, U, best: base + U };
      }

      // ---------- Rendering: small template helpers ----------
      const itemRow = (g, i) => `
        <div class="row">
          <div>${esc(i.n)}<div class="sm" id="p${i.id}"></div></div>
          <input type="number" inputmode="decimal" min="0" step="any"
            placeholder="of ${+i.max || 100}" value="${esc(i.s)}"
            aria-label="${esc(i.n)} actual score"
            data-t="i" data-g="${g.id}" data-i="${i.id}" data-f="s">
          <input type="number" inputmode="decimal" min="0" max="100" step="any"
            placeholder="predicted" value="${esc(i.e)}" id="e${i.id}"
            aria-label="${esc(i.n)} predicted percentage"
            data-t="i" data-g="${g.id}" data-i="${i.id}" data-f="e">
        </div>`;

      const groupBlock = (g) => `
        <section class="grp">
          <h2>${esc(g.n)} <span>(${+g.w || 0}% of grade)</span></h2>
          ${g.items.map((i) => itemRow(g, i)).join("")}
        </section>`;

      const options = (list, value) =>
        list
          .map(([x, label]) => `<option value="${x}"${+x === +value ? " selected" : ""}>${label}</option>`)
          .join("");

      const itemEditor = (g, i) => `
        <div class="ed it">
          <input data-t="i" data-g="${g.id}" data-i="${i.id}" data-f="n"
            value="${esc(i.n)}" aria-label="Item name">
          <input type="number" data-t="i" data-g="${g.id}" data-i="${i.id}" data-f="max"
            value="${esc(i.max)}" aria-label="Maximum score">
          <button class="x" data-a="delitem" data-g="${g.id}" data-i="${i.id}"
            aria-label="Remove item">✕</button>
        </div>`;

      const groupEditor = (g) => `
        <div class="ed">
          <input data-t="g" data-g="${g.id}" data-f="n" value="${esc(g.n)}" aria-label="Group name">
          <input type="number" data-t="g" data-g="${g.id}" data-f="w"
            value="${esc(g.w)}" aria-label="Group weight in percent">
          <button class="x" data-a="delgrp" data-g="${g.id}" aria-label="Remove group">✕</button>
        </div>
        ${g.items.map((i) => itemEditor(g, i)).join("")}
        <button class="add" data-a="additem" data-g="${g.id}">Add item to ${esc(g.n)}</button>`;

      const scaleEditor = (r, k) => `
        <div class="ed">
          <input type="number" step="0.25" data-t="r" data-r="${k}" data-f="g"
            value="${r.g}" aria-label="Grade">
          <input type="number" data-t="r" data-r="${k}" data-f="m"
            value="${r.m}" aria-label="Minimum percent">
          <button class="x" data-a="delrow" data-r="${k}" aria-label="Remove grade">✕</button>
        </div>`;

      // ---------- Rendering: page sections ----------
      function renderTabs() {
        const S = cur();
        const tab = (s) => `
          <button class="tab${s.id === S.id ? " on" : ""}" data-a="tab" data-id="${s.id}">
            ${esc(s.n || "Untitled")}
          </button>`;
        $("#tabs").innerHTML =
          D.subs.map(tab).join("") + '<button class="tab" data-a="addsub">Add subject</button>';
      }

      function renderInp() {
        const S = cur();
        $("#inp").innerHTML = `
          <div class="row hd sm"><span></span><span>Actual Score</span><span>Predicted Percentage</span></div>
          ${S.groups.map(groupBlock).join("")}
          <p class="sm">Type your actual score once you have it. Until then, a predicted percentage lets you test what-ifs. Leave both empty on the exams you want the planner to solve for.</p>`;
      }

      function renderSetup() {
        const S = cur();
        const grades = S.scale.map((r) => [r.g, fx(r.g)]);
        const total = S.groups.reduce((sum, g) => sum + (+g.w || 0), 0);
        const rescaleNote = total === 100 ? "" : ", so the planner rescales them to 100%";
        const deleteBtn = '<button class="add" data-a="delsub">Delete this subject</button>';
        $("#setup").innerHTML = `
          <details id="cfg"${setupOpen ? " open" : ""}>
            <summary>Grading system and grade scale</summary>
            <div class="cfg">
              <label class="sm">Subject name<input data-t="s" data-f="n" value="${esc(S.n)}"></label>
              <label class="sm">Goal grade<select data-t="s" data-f="goal">${options(grades, S.goal)}</select></label>
              <label class="sm">Passing grade<select data-t="s" data-f="pass">${options(grades, S.pass)}</select></label>
            </div>
            <p class="sm">Items in a group share its weight equally. Weights add up to ${total}%${rescaleNote}.</p>
            ${S.groups.map(groupEditor).join("")}
            <button class="add" data-a="addgrp">Add group</button>
            <p class="sm">Grade scale: the lowest percentage that earns each grade.</p>
            ${S.scale.map(scaleEditor).join("")}
            <button class="add" data-a="addrow">Add grade</button>
            <p class="sm">The starter cutoffs are placeholders, not official. Replace them with the table from your syllabus.</p>
            ${deleteBtn}
          </details>`;
      }

      function renderRes() {
        const S = cur();
        const c = calc(S);
        const clamp = (v) => Math.max(0, Math.min(100, v));

        // Items still open, and the status of every rung on the grade ladder
        const open = c.items.filter((x) => x.st === "open");
        const names = esc(open.map((x) => x.i.n || "item").join(", "));
        const rows = sorted(S).map((r) => {
          const T = r.m;
          let st = "out";
          let need = 0;
          if (c.base >= T - 1e-9) {
            st = "lock";
          } else if (c.best >= T - 1e-9) {
            st = "go";
            need = ((T - c.base) / c.U) * 100;
          }
          return { ...r, T, st, need };
        });
        const goal = rows.find((r) => +r.g === +S.goal);
        const pass = rows.find((r) => +r.g === +S.pass);

        // Wording for the headline and the passing line
        const mxs = [...new Set(open.map((x) => x.mx))];
        const pts = (r) =>
          mxs.length === 1 ? ` (about ${((r.need / 100) * mxs[0]).toFixed(1)} of ${mxs[0]} each)` : "";
        const say = (r) => {
          if (r.st === "lock") return "locked in";
          if (r.st === "go") return `average <b>${r.need.toFixed(1)}%</b> on ${names}${pts(r)}`;
          return "out of reach";
        };

        let hl;
        if (!goal) {
          hl = "Pick a goal grade in the setup section.";
        } else if (!open.length) {
          const verdict = goal.st === "lock" ? "met" : "not met";
          hl = `Your total is <b>${c.base.toFixed(2)}%</b>, a <b>${fx(gradeFor(S, c.base))}</b>. The goal of ${fx(goal.g)} is ${verdict}.`;
        } else if (goal.st === "lock") {
          hl = `<b>${fx(goal.g)}</b> is locked in. Even 0% on ${names} keeps it.`;
        } else if (goal.st === "go") {
          hl = `To get <b>${fx(goal.g)}</b>, ${say(goal)}.`;
        } else {
          hl = `<b>${fx(goal.g)}</b> is out of reach. Your best possible grade is <b>${fx(gradeFor(S, c.best))}</b>.`;
        }
        const passText = open.length ? say(pass || {}) : pass && pass.st === "lock" ? "met" : "not met";
        const passLine = pass ? `<p class="sm">Passing grade ${fx(pass.g)}: ${passText}.</p>` : "";

        // Range bar and ladder
        const left = clamp(c.base);
        const width = Math.max(0, Math.min(100 - left, c.U));
        const goalMark = goal ? `<div class="mk" style="left:${clamp(goal.T)}%"></div>` : "";
        const label = (r) => {
          if (r.st === "lock") return "Locked in";
          if (r.st === "go") return `Needs an average of ${r.need.toFixed(1)}%`;
          return "Out of reach";
        };
        const ladderRow = (r) => {
          const cls = ["l", r.st, r.st === "go" && r.need > 85 && "hard", r === goal && "me"]
            .filter(Boolean)
            .join(" ");
          const tags =
            (r === goal ? '<span class="tag">goal</span>' : "") +
            (r === pass ? '<span class="tag">passing</span>' : "");
          return `
            <div class="${cls}">
              <div class="gr">${fx(r.g)}</div>
              <div><b>${label(r)}</b>${tags}<div class="sm">${r.m}% overall</div></div>
            </div>`;
        };

        $("#res").innerHTML = `
          <div class="panel">
            <p class="hl">${hl}</p>
            ${passLine}
            <div class="track">
              <div class="rng" style="left:${left}%;width:${width}%"></div>
              ${goalMark}
            </div>
            <div class="sm" style="display:flex;justify-content:space-between;gap:8px">
              <span>0%</span>
              <span>Worst case ${fx(gradeFor(S, c.base))}, best case ${fx(gradeFor(S, c.best))}</span>
              <span>100%</span>
            </div>
            <p class="sm">The bar shows where your total can land. The line marks your goal.</p>
            <div class="ladder">${rows.map(ladderRow).join("")}</div>
            <p class="sm">Your data stays in this browser.</p>
          </div>`;
        $("#bar").innerHTML = hl;
        c.items.forEach((x) => {
          const p = $("#p" + x.i.id),
            e = $("#e" + x.i.id);
          if (p)
            p.textContent =
              x.st === "done"
                ? x.p.toFixed(1) + "% scored"
                : x.st === "est"
                  ? "Predicting " + x.p + "%"
                  : "Still open";
          if (e) e.disabled = x.st === "done";
        });
      }

      const renderAll = () => {
        renderTabs();
        renderInp();
        renderSetup();
        renderRes();
      };

      function tgt(d) {
        const S = cur();
        if (d.t === "s") return S;
        const g = S.groups.find((x) => x.id === d.g);
        if (d.t === "g") return g;
        if (d.t === "i") return g && g.items.find((x) => x.id === d.i);
        if (d.t === "r") return S.scale[+d.r];
      }
      document.addEventListener("input", (e) => {
        const el = e.target,
          d = el.dataset;
        if (!d.t) return;
        const o = tgt(d);
        if (!o) return;
        o[d.f] = d.t === "r" || (d.t === "s" && d.f !== "n") ? +el.value || 0 : el.value;
        save();
        renderRes();
      });
      document.addEventListener("change", (e) => {
        const d = e.target.dataset;
        if (!d.t) return;
        if (d.t === "r" && d.f === "g") renderSetup();
        else if (["n", "w", "max"].includes(d.f)) {
          renderInp();
          renderTabs();
          renderRes();
        }
      });
      document.addEventListener("click", (e) => {
        const b = e.target.closest("[data-a]");
        if (!b) return;
        const d = b.dataset,
          S = cur(),
          a = d.a;
        const G = () => S.groups.find((g) => g.id === d.g);
        if (a === "tab") D.cur = d.id;
        else if (a === "addsub") {
          const s = blank();
          D.subs.push(s);
          D.cur = s.id;
          setupOpen = true;
        } else if (a === "delsub") {
          if (!confirm("Delete this subject?")) return;
          D.subs = D.subs.filter((x) => x !== S);
          if (!D.subs.length) D.subs.push(blank());
          D.cur = D.subs[0].id;
        } else if (a === "addgrp") S.groups.push(gp("New group", 10, [it("Item 1", 100)]));
        else if (a === "delgrp") S.groups = S.groups.filter((g) => g.id !== d.g);
        else if (a === "additem") G().items.push(it("Item " + (G().items.length + 1), 100));
        else if (a === "delitem") {
          const g = G();
          g.items = g.items.filter((i) => i.id !== d.i);
        } else if (a === "addrow") S.scale.push({ g: 5, m: 0 });
        else if (a === "delrow") S.scale.splice(+d.r, 1);
        save();
        renderAll();
      });
      renderAll();
    </script>
  </body>
</html>
